# UPS settings. Installed as /etc/default/homestack-ups. After editing, re-run
# deploy/debian/ups/install.sh (it rewrites the NUT files from these).

# Shut down after this many seconds on battery, unless power comes back.
UPS_SHUTDOWN_AFTER=300
# ...or straight away when the battery drops to this % or this many seconds of runtime.
UPS_LOW_CHARGE=40
UPS_LOW_RUNTIME=420
