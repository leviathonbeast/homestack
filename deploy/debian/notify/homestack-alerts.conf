# Settings for the server alert jobs. Installed as /etc/default/homestack-alerts.
# Edit and save; every job reads this file each time it runs.

# Disk temperatures (°C). A disk is reported when it reaches WARN or CRIT,
# and again when it has cooled 3°C below WARN.
TEMP_WARN=45
TEMP_CRIT=50
SSD_TEMP_WARN=60           # SATA SSDs (Samsung, Crucial, WD Blue…)
SSD_TEMP_CRIT=70
NVME_TEMP_WARN=65
NVME_TEMP_CRIT=75

# SSD wear: report an SSD that has used this much of its rated write life.
SSD_WEAR_WARN=80

# Disk space: report a filesystem or ZFS pool fuller than this (percent).
# The boot drive, Docker's folder, the cache, every pool and every unassigned
# disk are checked; add any other mount points here, separated by spaces.
SPACE_WARN=90
SPACE_MOUNTS=""

# Mover: which shares to move from the cache to the array, and how old a
# file must be (minutes) before it's moved. Once shares are managed on
# Homestack's Shares page, each share's "Move to the array nightly" switch
# decides instead, and an age set in Settings → Storage replaces
# MOVER_AGE_MIN (both written to /etc/default/homestack-mover-shares).
MOVER_SHARES=""            # folder names in the shares, separated by spaces
MOVER_AGE_MIN=1440
MOVER_NOTIFY_EMPTY=no      # yes = also report runs that had nothing to move
MOVER_NOTIFY_START=no      # yes = also report when the mover starts

# Logs: the mover and parity jobs keep a log of each run (Storage →
# History), in /var/log/homestack-agent/runs. How many of each to keep:
LOG_KEEP=30

# SnapRAID parity. Settings → Storage → Parity overrides these
# (written to /etc/default/homestack-parity).
SNAPRAID_DELETE_LIMIT=500  # skip a sync if more files than this were deleted
SNAPRAID_UPDATE_LIMIT=1000 # or modified (ransomware encrypting files looks like this)
SNAPRAID_SCRUB_PERCENT=8   # how much of the array each scrub checks
SNAPRAID_SCRUB_AGE=10      # only scrub blocks not checked for this many days
