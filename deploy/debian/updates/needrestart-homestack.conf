# After a security update, restart the services that use the patched
# library without asking. Installed as /etc/needrestart/conf.d/homestack.conf.
$nrconf{restart} = 'a';
# ...except these, which would stop containers, VMs, a parity sync or the
# fans' control. They pick the fix up at the next reboot.
$nrconf{override_rc}->{qr(^docker)} = 0;
$nrconf{override_rc}->{qr(^containerd)} = 0;
$nrconf{override_rc}->{qr(^libvirt)} = 0;
$nrconf{override_rc}->{qr(^virt)} = 0;
$nrconf{override_rc}->{qr(^homestack)} = 0;
$nrconf{override_rc}->{qr(^zfs)} = 0;
